# Kill every postgres process
pkill -9 postgres
pkill -9 postmaster
sleep 2

# Remove ALL lock files
rm -f /data/data/com.termux/files/usr/var/lib/postgresql/postmaster.pid
rm -f /data/data/com.termux/files/usr/var/lib/postgresql/*.pid

# Backup your current config
cp /data/data/com.termux/files/usr/var/lib/postgresql/postgresql.conf \
   /data/data/com.termux/files/usr/var/lib/postgresql/postgresql.conf.bak.$(date +%s)

cat > /data/data/com.termux/files/usr/var/lib/postgresql/postgresql.conf << 'PGCONF'
#------------------------------------------------------------------------------
# TERMUX DEVELOPMENT CONFIG — Minimal, Stable, Mobile-Optimized
#------------------------------------------------------------------------------

# Connection
listen_addresses = '127.0.0.1'
port = 5431
max_connections = 10

# Memory — reduced for mobile devices
shared_buffers = 64MB
work_mem = 2MB
maintenance_work_mem = 32MB
effective_cache_size = 192MB
temp_buffers = 8MB

# WAL — minimal for single-node dev
wal_level = minimal
archive_mode = off
max_wal_size = 128MB
min_wal_size = 32MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.8
wal_compression = on
wal_writer_delay = 200ms

# Disable archiving completely (was causing your crash)
archive_command = ''
archive_library = ''
archive_timeout = 0

# Recovery
fsync = on
synchronous_commit = off          # faster for dev; data is safe enough with fsync
full_page_writes = on

# Query Planner
random_page_cost = 1.1            # SSD (phone storage)
effective_io_concurrency = 200    # fast flash storage

# Parallelism — conservative for mobile
max_worker_processes = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
max_parallel_workers = 2

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 10MB
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%t [%p] %q%u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Autovacuum
autovacuum = on
autovacuum_max_workers = 1

# Locale
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

# Security (local dev)
password_encryption = scram-sha-256
ssl = off
PGCONF
